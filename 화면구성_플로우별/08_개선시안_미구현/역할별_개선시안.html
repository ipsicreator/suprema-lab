<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수프리마랩 개선 시안</title><body style="max-width:1200px;margin:32px auto;padding:16px;font-family:system-ui"><div id="suprema-review">
<style>
#suprema-review{--sp-bg:light-dark(#f7f5f1,#191b20);--sp-paper:light-dark(#ffffff,#24272e);--sp-ink:light-dark(#242320,#f1eee9);--sp-sub:light-dark(#706b65,#bdb6ad);--sp-line:light-dark(#e5dfd7,#41434b);--sp-red:light-dark(#8d2228,#f09a9f);--sp-on:light-dark(#fff,#241316);--sp-soft:light-dark(#f6eaea,#402c32);font:15px/1.6 system-ui,sans-serif;color:var(--sp-ink)}
#suprema-review *{box-sizing:border-box}#suprema-review button,#suprema-review select{font:inherit;color:inherit}#suprema-review button{cursor:pointer}#suprema-review .sp-caption{margin:0 0 12px;color:var(--sp-sub)}#suprema-review .sp-window{background:var(--sp-bg);border:1px solid var(--sp-line);border-radius:16px;overflow:hidden}#suprema-review .sp-header{background:var(--sp-paper);padding:20px 24px;border-bottom:1px solid var(--sp-line);display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}#suprema-review .sp-brand{font-size:21px;font-weight:800;letter-spacing:-.6px}#suprema-review .sp-brand small{display:block;font-size:12px;font-weight:500;color:var(--sp-sub);letter-spacing:0}#suprema-review select{background:var(--sp-paper);border:1px solid var(--sp-line);border-radius:7px;padding:8px 12px;max-width:100%}#suprema-review .sp-body{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:480px}#suprema-review .sp-nav{padding:20px 12px;background:var(--sp-paper);border-right:1px solid var(--sp-line)}#suprema-review .sp-nav button{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:8px;margin-bottom:4px}#suprema-review .sp-nav button[aria-pressed=true]{background:var(--sp-soft);color:var(--sp-red);font-weight:700}#suprema-review .sp-main{padding:26px;min-width:0}#suprema-review h2{font-size:24px;margin:4px 0 8px;letter-spacing:-.7px}#suprema-review h3{font-size:16px;margin:0 0 12px}#suprema-review p{margin:0 0 18px}#suprema-review .sp-note{color:var(--sp-sub);font-size:13px}#suprema-review .sp-box{background:var(--sp-paper);border:1px solid var(--sp-line);border-radius:12px;padding:20px;margin:18px 0}#suprema-review .sp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#suprema-review .sp-item{padding:14px 0;border-bottom:1px solid var(--sp-line)}#suprema-review .sp-item strong{display:block}#suprema-review .sp-item span{color:var(--sp-sub);font-size:13px}#suprema-review .sp-action{background:var(--sp-red);color:var(--sp-on);border:0;border-radius:8px;padding:10px 16px}#suprema-review .sp-status{color:var(--sp-red);font-size:13px;font-weight:700}#suprema-review .sp-steps{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#suprema-review .sp-steps span{padding:5px 10px;background:var(--sp-paper);border:1px solid var(--sp-line);border-radius:6px;font-size:13px}#suprema-review .sp-steps .sp-current{background:var(--sp-soft);color:var(--sp-red);border-color:var(--sp-red)}#suprema-review table{border-collapse:collapse;width:100%;font-size:14px}#suprema-review th,#suprema-review td{text-align:left;border-bottom:1px solid var(--sp-line);padding:13px 6px;overflow-wrap:anywhere}#suprema-review th{color:var(--sp-sub);font-weight:500}#suprema-review .sp-inline{border:0;background:transparent;color:var(--sp-red);padding:6px;font-weight:700}#suprema-review .sp-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#suprema-review label{display:block;font-size:13px;color:var(--sp-sub)}#suprema-review label select{display:block;width:100%;margin-top:5px}#suprema-review .sp-footer{color:var(--sp-sub);font-size:12px;padding:12px 24px;border-top:1px solid var(--sp-line);background:var(--sp-paper)}
@media(max-width:600px){#suprema-review .sp-body{grid-template-columns:1fr}#suprema-review .sp-nav{display:flex;overflow:visible;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--sp-line);padding:8px}#suprema-review .sp-nav button{width:auto;padding:10px}#suprema-review .sp-main{padding:18px}#suprema-review .sp-header{padding:16px}#suprema-review .sp-grid,#suprema-review .sp-form{grid-template-columns:1fr}#suprema-review th,#suprema-review td{padding:10px 3px;font-size:12px}}
</style>
<p class="sp-caption">개선 시안 · 역할과 메뉴를 바꾸며 화면 구성을 확인할 수 있습니다.</p>
<div class="sp-window">
 <header class="sp-header"><div class="sp-brand">수프리마랩<small>입시 분석 · 상담 운영</small></div><label>화면 역할 <select id="sp-role" aria-label="확인할 역할"><option value="consultant">담당 컨설턴트</option><option value="academy">학원 관리자</option><option value="head">본사 관리자</option><option value="master">마스터</option></select></label></header>
 <div class="sp-body"><nav class="sp-nav" aria-label="업무 메뉴" id="sp-nav"></nav><main class="sp-main" id="sp-content" aria-live="polite"></main></div>
 <footer class="sp-footer">화면 검토용 예시 · 학원·학생 이름은 가상 · 저장·업로드·진단 실행 없음</footer>
</div>
<script>
(()=>{
const root=document.getElementById('suprema-review');
const role=root.querySelector('#sp-role'),nav=root.querySelector('#sp-nav'),content=root.querySelector('#sp-content');
const menus={consultant:[['students','담당 학생'],['diagnosis','학생 진단'],['reports','보고서']],academy:[['academy','학원 운영'],['students','학생·담당 배정'],['reports','보고서 검토']],head:[['academies','학원 관리'],['data','공통 입시 자료'],['reports','운영 현황']],master:[['policy','권한·정책'],['academies','전체 학원'],['data','공통 입시 자료']]};
let active='students';
const box=(s)=>'<section class="sp-box">'+s+'</section>';
function render(){
nav.innerHTML=menus[role.value].map(([id,label])=>'<button type="button" data-page="'+id+'" aria-pressed="'+(id===active)+'">'+label+'</button>').join('');
let html='';
if(active==='students') html='<div class="sp-note">예시 학원 / '+(role.value==='academy'?'학원 관리자':'담당 컨설턴트')+'</div><h2>'+(role.value==='academy'?'학생·담당 배정':'담당 학생')+'</h2><p class="sp-note">학생 선택 → 자료 확인 → 분석·상담 → 보고서</p>'+box('<table><thead><tr><th>학생</th><th>진행 단계</th><th>다음 업무</th></tr></thead><tbody><tr><td>예시 학생 A<br><span class="sp-note">고3 · 담당자 A</span></td><td>학생부 확인</td><td><button type="button" class="sp-inline" data-open="diagnosis">진단 열기 →</button></td></tr><tr><td>예시 학생 B<br><span class="sp-note">고2 · 담당자 A</span></td><td>탐구 상담</td><td><button type="button" class="sp-inline" data-open="diagnosis">상담 이어가기 →</button></td></tr></tbody></table>');
if(active==='diagnosis') html='<div class="sp-note">예시 학원 / 예시 학생 A · 고3 / 담당자 A</div><h2>학생 진단</h2><div class="sp-steps"><span>1 정보·자료</span><span>2 학생부 분석</span><span>3 탐구·독서·세특</span><span class="sp-current">4 입시 위치</span></div>'+box('<h3>지원 전형 선택</h3><div class="sp-form"><label>대학<select><option>대학 선택</option></select></label><label>모집단위<select disabled><option>대학 선택 후 표시</option></select></label><label>전형 유형<select disabled><option>모집단위 선택 후 표시</option></select></label><label>전형명<select disabled><option>전형 유형 선택 후 표시</option></select></label></div>')+box('<h3>진단 결과와 근거</h3><p class="sp-note">진단 후 판정·학년도별 입결·비교 기준을 같은 영역에 표시</p><span class="sp-status">시안 — 실제 진단 결과 없음</span>')+'<button class="sp-action" type="button" data-open="reports">보고서 구성 보기 →</button>';
if(active==='reports') html='<h2>'+(role.value==='head'?'운영 현황':'보고서 검토')+'</h2><p class="sp-note">'+(role.value==='head'?'학원별 이용 현황 중심 · 학생 원문 열람은 별도 권한':'작성 중 → 담당자 검토 → 확정 → 학생·학부모 공개')+'</p>'+box('<h3>보고서 구성</h3><div class="sp-item"><strong>학생 요약</strong><span>기본 정보 · 희망 진로 · 자료 기준일</span></div><div class="sp-item"><strong>분석과 실행 과제</strong><span>학생부 강점 · 보완점 · 탐구·독서 계획</span></div><div class="sp-item"><strong>입시 위치와 판단 근거</strong><span>대학·전형 · 학년도별 입결 · 적용 자료 버전</span></div><div class="sp-item"><strong>확정 정보</strong><span>담당자 · 검토자 · 확정일 · 공개 범위</span></div>');
if(active==='academy') html='<h2>학원 운영</h2><p class="sp-note">소속 학원 안에서 담당자와 학생을 관리</p><div class="sp-grid">'+box('<h3>담당 컨설턴트</h3><div class="sp-item"><strong>초대·권한 설정</strong><span>소속 담당자 등록과 해제</span></div>')+box('<h3>학생 관리</h3><div class="sp-item"><strong>학생 등록·담당 배정</strong><span>담당 변경 이력과 보고서 검토</span></div>')+'</div>';
if(active==='academies') html='<h2>'+(role.value==='master'?'전체 학원':'배정 학원 관리')+'</h2><p class="sp-note">학원 등록 → 관리자 지정 → 계약·이용권 관리</p>'+box('<table><thead><tr><th>학원</th><th>운영 책임자</th><th>업무</th></tr></thead><tbody><tr><td>예시 학원</td><td>학원 관리자 A</td><td>계정·계약 확인</td></tr></tbody></table>');
if(active==='policy') html='<h2>권한·정책</h2><p class="sp-note">플랫폼 운영 범위와 공통 기준 승인</p>'+box('<div class="sp-item"><strong>본사 관리자 지정</strong><span>관리할 학원과 접근 범위 설정</span></div><div class="sp-item"><strong>공통 판단 기준 승인</strong><span>입시 근거 · 적용 기준 · 변경 이력</span></div><div class="sp-item"><strong>가격·권한 정책</strong><span>역할별 이용 범위와 운영 정책</span></div>');
if(active==='data') html='<h2>공통 입시 자료</h2><p class="sp-note">파일 선택 → 검증 → 미리보기 → 승인·반영</p>'+box('<h3>파일 업로드</h3><p>엑셀 · CSV · TSV</p><div class="sp-item"><strong>검증 결과</strong><span>대학·전형 수 · 오류 · 제외 항목</span></div><div class="sp-item"><strong>반영 버전</strong><span>적용 파일 · 학년도 · 등록자 · 변경 이력</span></div><div class="sp-item"><strong>복원</strong><span>이전 자료로 되돌리기</span></div>');
content.innerHTML=html;
}
root.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-open]');if(!b)return;active=b.dataset.page||b.dataset.open;render();});
role.addEventListener('change',()=>{active=menus[role.value][0][0];render();});render();
})();
</script>
</div>
</body></html>
